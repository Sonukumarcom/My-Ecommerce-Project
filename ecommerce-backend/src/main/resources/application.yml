
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-ms: 86400000
      refresh-token:
        expiration-ms: 604800000

  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:5174"
      - "http://localhost:3000"
      - "https://my-ecommerce-project-h4cx.vercel.app"
